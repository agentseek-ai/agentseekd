name: Build
run-name: Build ${{ github.ref_name }}

# Expensive desktop bundle builds only run on release-track events:
#   - tag push v*       (actual release)
#   - workflow_dispatch  (manual)
# Push to main / PR / schedule do NOT trigger this workflow.
# The CI workflow (ci.yml) handles testing on those branches.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Verify Release Gate (fast, gates the expensive build matrix) ────
  verify:
    name: Verify Release Gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Rust type-check
        working-directory: src-tauri
        run: cargo check

  # ─── Build Desktop Bundles (4-platform matrix) ──────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
          - platform: macos-14
            target: x86_64-apple-darwin
            label: macOS Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Normalize version for MSI (numeric-only required)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          RAW=$(node -p "require('./package.json').version")
          NUMERIC="${RAW%%-*}"
          # Rewrite tauri.conf.json in-place — MSI rejects semver pre-release suffixes
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '$NUMERIC';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
          echo "Normalized tauri.conf.json version to $NUMERIC"

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }}

      - name: Create DMG with custom background
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find src-tauri/target -path '*/release/bundle/macos/*.app' -maxdepth 7 | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found — skipping DMG beautification"
            exit 0
          fi
          APP_NAME=$(basename "$APP" .app)
          BUNDLE_ROOT=$(echo "$APP" | sed 's|/macos/.*||')
          DMG_DIR="$BUNDLE_ROOT/dmg"
          mkdir -p "$DMG_DIR"
          rm -f "$DMG_DIR"/*.dmg 2>/dev/null || true

          VERSION=$(node -p "require('./package.json').version")
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x64 ;;
            *)                    ARCH=universal ;;
          esac
          OUTPUT="$DMG_DIR/${APP_NAME// /_}_${VERSION}_${ARCH}.dmg"
          BG="src-tauri/resources/dmg-background.png"

          bash scripts/create-dmg.sh "$APP" "$OUTPUT" "$BG"

      - name: Collect bundle files
        shell: bash
        env:
          TARGET_BUNDLE_ROOT: src-tauri/target/${{ matrix.target }}/release/bundle
          DEFAULT_BUNDLE_ROOT: src-tauri/target/release/bundle
          ARTIFACT_DIR: ci-artifacts/${{ matrix.label }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"

          BUNDLE_ROOTS=()
          if [ -d "$TARGET_BUNDLE_ROOT" ]; then
            BUNDLE_ROOTS+=("$TARGET_BUNDLE_ROOT")
          fi
          if [ -d "$DEFAULT_BUNDLE_ROOT" ] && [ "$DEFAULT_BUNDLE_ROOT" != "$TARGET_BUNDLE_ROOT" ]; then
            BUNDLE_ROOTS+=("$DEFAULT_BUNDLE_ROOT")
          fi

          if [ "${#BUNDLE_ROOTS[@]}" -eq 0 ]; then
            echo "No bundle directory found" >&2
            echo "Checked:" >&2
            echo "  - $TARGET_BUNDLE_ROOT" >&2
            echo "  - $DEFAULT_BUNDLE_ROOT" >&2
            exit 1
          fi

          case "$RUNNER_OS" in
            Linux)
              for root in "${BUNDLE_ROOTS[@]}"; do
                find "$root" -maxdepth 3 -type f \
                  \( -name '*.AppImage' -o -name '*.deb' \) \
                  -exec cp '{}' "$ARTIFACT_DIR"/ \;
              done
              ;;
            macOS)
              for root in "${BUNDLE_ROOTS[@]}"; do
                find "$root" -maxdepth 3 -type f \
                  \( -name '*.dmg' -o -name '*.app.tar.gz' \) \
                  -exec cp '{}' "$ARTIFACT_DIR"/ \;
              done
              ;;
            Windows)
              for root in "${BUNDLE_ROOTS[@]}"; do
                find "$root" -maxdepth 3 -type f \
                  \( -name '*.msi' -o -name '*.exe' \) \
                  -exec cp '{}' "$ARTIFACT_DIR"/ \;
              done
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          # Normalize bundle names to the AgentSeek_Desktop_* convention on
          # every platform: productName spaces appear as spaces in some Tauri
          # bundles and as dots ("AgentSeek.Desktop_...") in Linux/Windows
          # ones. Replace only the product-name prefix, never version dots.
          for f in "$ARTIFACT_DIR"/*; do
            [ -e "$f" ] || continue
            b="$(basename "$f")"
            b="${b// /_}"
            b="${b/AgentSeek.Desktop_/AgentSeek_Desktop_}"
            if [ "$b" != "$(basename "$f")" ]; then
              mv "$f" "$(dirname "$f")/$b" 2>/dev/null || true
            fi
          done

          if [ -z "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -print -quit)" ]; then
            echo "No bundle files were collected for $RUNNER_OS" >&2
            for root in "${BUNDLE_ROOTS[@]}"; do
              echo "--- $root ---" >&2
              find "$root" -maxdepth 4 -type f | sort >&2
            done
            exit 1
          fi

          {
            echo "### ${{ matrix.label }}"
            while IFS= read -r file; do
              echo "- $(basename "$file")"
            done < <(find "$ARTIFACT_DIR" -maxdepth 1 -type f | sort)
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: agentseek-${{ matrix.label }}
          path: ci-artifacts/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14

