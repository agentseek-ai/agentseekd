name: Sign & Notarize
run-name: Sign & Notarize ${{ inputs.tag }}

# Manual-only: downloads build artifacts → signs + notarizes + staples macOS DMGs → creates GitHub Release.
# Prerequisite: Build workflow has completed for the given tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.1-rc.1)'
        required: true

permissions:
  contents: write

jobs:
  sign-and-notarize:
    name: Sign, Notarize & Publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          echo "✓ Tag $TAG matches package.json version $PACKAGE_VERSION"

      - name: Find Build workflow run ID
        id: build_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list \
            --workflow=build.yml \
            --branch="$TAG" \
            --status=success \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful Build workflow run found for tag $TAG"
            echo "Make sure the Build workflow has completed successfully first."
            exit 1
          fi
          echo "Found Build run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-bundles
          gh run download ${{ steps.build_run.outputs.run_id }} \
            --dir release-bundles
          echo "Downloaded artifacts:"
          find release-bundles -type f | sort

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build-keychain-temp' }}
        run: |
          set -euo pipefail
          KEYCHAIN="build.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security default-keychain -s "$KEYCHAIN"

          rm -f cert.p12
          echo "✓ Certificate imported"

      - name: Sign + Notarize + Staple macOS DMGs
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p signed

          # Find all macOS DMGs in the downloaded artifacts
          # Use while-read to handle paths with spaces (artifact dir names like "agentseek-macOS Intel")
          dmg_count=0
          while IFS= read -r -d '' dmg; do
            dmg_count=$((dmg_count + 1))
            basename=$(basename "$dmg")
            output="signed/$basename"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Processing: $basename"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""

            ./scripts/sign-and-notarize.sh \
              --dmg "$dmg" \
              --output "$output"
          done < <(find release-bundles -name '*.dmg' -type f -print0)

          if [ "$dmg_count" -eq 0 ]; then
            echo "::error::No .dmg files found in build artifacts"
            exit 1
          fi

          echo ""
          echo "✓ All $dmg_count DMG(s) signed, notarized, and stapled"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Copy signed macOS DMGs
          find signed -name '*.dmg' -type f -exec cp '{}' release-assets/ \;

          # Copy other platform assets (Linux, Windows, .app.tar.gz)
          find release-bundles -type f \
            \( -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp '{}' release-assets/ \;

          if [ -z "$(find release-assets -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::No release assets collected"
            exit 1
          fi

          (cd release-assets && sha256sum * > SHA256SUMS.txt)

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f | sort

      - name: Resolve release notes base tag
        id: release_notes_base
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          previous_ancestor_tag=""
          if git rev-parse --verify "${TAG}^{tag}" >/dev/null 2>&1 || git rev-parse --verify "${TAG}^{commit}" >/dev/null 2>&1; then
            previous_ancestor_tag="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          fi

          previous_tag="$previous_ancestor_tag"
          if printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            previous_stable_tag=""
            while IFS= read -r candidate; do
              if [ "$candidate" = "$TAG" ]; then
                break
              fi
              previous_stable_tag="$candidate"
            done < <(git tag -l 'v*' --sort=v:refname 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)

            first_release_tag="$(git tag -l 'v*' --sort=v:refname 2>/dev/null | head -n 1 || true)"
            previous_tag="${previous_stable_tag:-$first_release_tag}"
          fi

          if [ "$previous_tag" = "$TAG" ]; then
            previous_tag=""
          fi

          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Create release preface
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GH_REPO}/releases/download/${TAG}"
          checksums_url="${BASE}/SHA256SUMS.txt"

          linux=""; macos_intel=""; macos_arm=""; windows=""
          for f in release-assets/*; do
            b=$(basename "$f")
            case "$b" in
              *.AppImage)          linux="${linux} · [AppImage](${BASE}/${b})" ;;
              *.deb)               linux="${linux} · [deb](${BASE}/${b})" ;;
              *aarch64*.dmg)       macos_arm="[dmg](${BASE}/${b})" ;;
              *_x64.dmg|*x64*.dmg) macos_intel="[dmg](${BASE}/${b})" ;;
              *.dmg)               macos_arm="${macos_arm:-[dmg](${BASE}/${b})}" ;;
              *.msi)               windows="${windows} · [msi](${BASE}/${b})" ;;
              *.exe)               windows="${windows} · [exe](${BASE}/${b})" ;;
              *.sig|SHA256SUMS.txt) ;;
            esac
          done
          linux="${linux# · }"; linux="${linux:-—}"
          windows="${windows# · }"; windows="${windows:-—}"
          macos_intel="${macos_intel:-—}"
          macos_arm="${macos_arm:-—}"

          {
            printf '## Install\n\n'
            printf '### Desktop App\n\n'
            printf 'Direct downloads for this release. Checksums: [`SHA256SUMS.txt`](%s)\n\n' "$checksums_url"
            printf '| Platform | Downloads |\n'
            printf '|---|---|\n'
            printf '| Linux x64 | %s |\n' "$linux"
            printf '| macOS Intel | %s |\n' "$macos_intel"
            printf '| macOS Apple Silicon | %s |\n' "$macos_arm"
            printf '| Windows x64 | %s |\n\n' "$windows"
          } > RELEASE_PREFACE.md

      - name: Generate release notes
        env:
          TAG: ${{ inputs.tag }}
          PREV_TAG: ${{ steps.release_notes_base.outputs.previous_tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate-release-notes.sh
          {
            cat RELEASE_PREFACE.md
            echo ""
            bash scripts/generate-release-notes.sh "$TAG" "$PREV_TAG"
          } > RELEASE_BODY.md
          echo "Generated release body ($(wc -l < RELEASE_BODY.md) lines)"

      - name: Resolve release options
        id: release_options
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          prerelease="false"
          if printf '%s' "$TAG" | grep -Eq '^v0\.0\.|-(rc|beta|alpha)'; then
            prerelease="true"
          fi
          make_latest="true"
          if [ "$prerelease" = "true" ]; then
            make_latest="false"
          fi
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          echo "make_latest=$make_latest" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          name: AgentSeek Desktop ${{ inputs.tag }}
          bodyFile: RELEASE_BODY.md
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: ${{ steps.release_options.outputs.prerelease }}
          makeLatest: ${{ steps.release_options.outputs.make_latest }}

      - name: Workflow summary
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## Sign & Notarize Complete"
            echo
            echo "Release: https://github.com/$REPOSITORY/releases/tag/$TAG"
            echo
            echo "Assets published:"
            while IFS= read -r file; do
              echo "- $(basename "$file")"
            done < <(find release-assets -maxdepth 1 -type f | sort)
          } >> "$GITHUB_STEP_SUMMARY"
