[package]
name = "agentseek-desktop"
version = "1.0.0"
description = "AgentSeek template instance deployment and runtime manager"
authors = ["AgentSeek Contributors"]
edition = "2021"

[lib]
name = "agentseek_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
tempfile = "3"
