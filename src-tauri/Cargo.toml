[package]
name = "agentseek-desktop"
# Version is read from ../package.json at build time via build.rs
# (env!("APP_VERSION")). The field below is a Cargo-required placeholder.
version = "0.0.0"
description = "AgentSeek template instance deployment and runtime manager"
authors = ["AgentSeek Contributors"]
edition = "2021"

[lib]
name = "agentseek_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"

# Windows only: run the instance `dev` process tree inside a hidden ConPTY
# pseudo-console so descendants that build Win32 console objects at startup
# (e.g. prompt_toolkit via `bub gateway`) do not crash with
# NoConsoleScreenBufferError. Unused on macOS/Linux.
[target.'cfg(windows)'.dependencies]
portable-pty = "0.8"

[dev-dependencies]
tempfile = "3"
